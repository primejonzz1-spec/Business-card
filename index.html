<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">

    <!-- Left side: Photo -->
    <div class="photo">
      <img src="me.jpeg" alt="Junior Jonzz">
    </div>

    <!-- Right side: Details -->
    <div class="details">
      <h1 class="name">Junior Jonzz</h1>
      <p class="title">Frontend Developer</p>
      <p class="company">Jonzz Developers</p>

      <div class="divider"></div>

      <div class="contact">
        <div class="contact-item">
          <span class="dot"></span>
          <span>juniorjonzz6@studio.com</span>
        </div>
        <div class="contact-item">
          <span class="dot"></span>
          <span>+254 768888897</span>
        </div>
        <div class="contact-item">
          <span class="dot"></span>
          <span>www.juniorstudio.com</span>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
